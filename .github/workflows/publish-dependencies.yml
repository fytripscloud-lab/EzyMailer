name: Publish runtime dependencies

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag used by the desktop bootstrapper
        required: true
        default: dependencies-v2
  push:
    tags:
      - dependencies-v*

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-14
            asset: ezymailer-dependencies-macos-arm64.zip
          - os: windows-latest
            asset: ezymailer-dependencies-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package runtime dependencies and Chromium
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          rm -rf runtime-dependencies
          mkdir -p runtime-dependencies
          python -m pip install --no-compile --target runtime-dependencies \
            "playwright>=1.51.0" \
            "python-pptx>=1.0.2" \
            "python-docx>=1.1.2" \
            "openpyxl>=3.1.5" \
            "reportlab>=4.4.3" \
            "Pillow>=3.3.2"
          mkdir -p runtime-dependencies/playwright-browsers
          PYTHONPATH="$PWD/runtime-dependencies" \
          PLAYWRIGHT_BROWSERS_PATH="$PWD/runtime-dependencies/playwright-browsers" \
            python -m playwright install chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("runtime-dependencies")
          asset = Path(os.environ["ASSET_NAME"])
          with ZipFile(asset, "w", ZIP_DEFLATED, compresslevel=9) as archive:
              for path in root.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ matrix.asset }}
          generate_release_notes: false
