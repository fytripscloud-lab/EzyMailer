name: Publish runtime dependencies

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag used by the desktop bootstrapper
        required: true
        default: dependencies-v1
  push:
    tags:
      - dependencies-v*

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-14
            asset: ezymailer-dependencies-macos-arm64.zip
          - os: windows-latest
            asset: ezymailer-dependencies-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package runtime dependencies
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          python -m venv .runtime-venv
          source .runtime-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install \
            "playwright>=1.51.0" \
            "python-pptx>=1.0.2" \
            "python-docx>=1.1.2" \
            "openpyxl>=3.1.5" \
            "reportlab>=4.4.3" \
            "Pillow>=3.3.2"
          rm -rf runtime-dependencies
          mkdir -p runtime-dependencies
          python - <<'PY'
          import pathlib
          import site
          import shutil

          destination = pathlib.Path("runtime-dependencies")
          source = pathlib.Path(site.getsitepackages()[0])
          packages = [
              "playwright",
              "pyee",
              "greenlet",
              "PIL",
              "docx",
              "openpyxl",
              "reportlab",
              "pptx",
              "lxml",
              "XlsxWriter",
          ]
          for name in packages:
              source_path = source / name
              if source_path.exists():
                  shutil.copytree(source_path, destination / name, dirs_exist_ok=True)
          for item in source.glob("*.dist-info"):
              if any(item.name.lower().startswith(name.lower() + "-") for name in packages):
                  shutil.copytree(item, destination / item.name, dirs_exist_ok=True)
          PY
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path runtime-dependencies/* -DestinationPath $env:ASSET_NAME -Force"
          else
            ditto -c -k --sequesterRsrc --keepParent runtime-dependencies "$ASSET_NAME"
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ matrix.asset }}
          generate_release_notes: false
